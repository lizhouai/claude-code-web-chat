[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "claude-code-web-chat"
version = "1.2.0"
description = "Intelligent Agent Web Service based on Claude Code SDK"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [
    {name = "Li Zhou", email = "li_zhou@example.com"},
]
keywords = ["claude", "ai", "agent", "web", "fastapi", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black",
    "isort",
    "flake8",
    "mypy",
]

[tool.hatch.build]
python = "3.11"

[project.urls]
Homepage = "https://github.com/lizhouai/claude-code-web-chat"
Repository = "https://github.com/lizhouai/claude-code-web-chat.git"
Documentation = "https://github.com/lizhouai/claude-code-web-chat/blob/main/README.md"
Issues = "https://github.com/lizhouai/claude-code-web-chat/issues"

[project.scripts]
claude-code-web-chat = "claude_code_web_chat.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["app", "frontend", "scripts", "claude_code_web_chat", "conf"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["app", "claude_code_web_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"